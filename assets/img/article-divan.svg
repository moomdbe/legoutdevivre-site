<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080b10"/><stop offset=".62" stop-color="#151b22"/><stop offset="1" stop-color="#0a0d12"/></linearGradient>
<radialGradient id="moon" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#f3e8d3"/><stop offset=".55" stop-color="#b9ad98"/><stop offset="1" stop-color="#4b4a4a"/></radialGradient>
<linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3b0"/><stop offset=".6" stop-color="#e0a35c"/><stop offset="1" stop-color="#7a4a22"/></linearGradient>
<linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9ccb4"/><stop offset="1" stop-color="#7d725f"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232a33"/><stop offset="1" stop-color="#06080b"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffcf8a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/></radialGradient>
<filter id="b6"><feGaussianBlur stdDeviation="6"/></filter><filter id="b18"><feGaussianBlur stdDeviation="18"/></filter><filter id="b2"><feGaussianBlur stdDeviation="1.6"/></filter>
</defs>
<rect width="900" height="600" fill="url(#bg)"/>
